name: Build KNULLI Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: retro-chiaki-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # GitHub's ubuntu-22.04 runner is amd64; the default Ubuntu mirrors only
      # carry amd64/i386 packages. arm64 packages live on the separate ports
      # mirror, so it needs to be added explicitly, and the existing default
      # sources restricted to amd64 so apt doesn't also try (and fail) to
      # fetch nonexistent arm64 indices from them.
      - name: Enable arm64 architecture
        run: |
          sudo dpkg --add-architecture arm64
          sudo sed -i 's/^deb /deb [arch=amd64] /' /etc/apt/sources.list
          sudo tee /etc/apt/sources.list.d/arm64-ports.list > /dev/null << 'EOF'
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-updates main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-security main restricted universe multiverse
          EOF

      - name: Install cross-compilation toolchain and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            cmake \
            ninja-build \
            pkg-config \
            python3 \
            git \
            zip \
            xkb-data \
            protobuf-compiler \
            libssl-dev:arm64 \
            libopus-dev:arm64 \
            libavcodec-dev:arm64 \
            libavformat-dev:arm64 \
            libavutil-dev:arm64 \
            libswscale-dev:arm64 \
            libswresample-dev:arm64 \
            libsdl2-dev:arm64 \
            libasound2-dev:arm64 \
            libpulse-dev:arm64 \
            libevdev-dev:arm64 \
            libudev-dev:arm64 \
            qtbase5-dev:arm64 \
            qttools5-dev:arm64 \
            libqt5svg5-dev:arm64 \
            qtmultimedia5-dev:arm64 \
            libqt5opengl5-dev:arm64 \
            qtbase5-dev \
            qttools5-dev \
            python3-pip
          pip3 install protobuf grpcio-tools

      - name: Build base dependency archive
        run: |
          chmod +x packaging/build/ci-package.sh
          packaging/build/ci-package.sh "${{ github.ref_name }}"

      - name: Convert package for KNULLI
        run: |
          chmod +x packaging/knulli/build.sh
          BASE_ZIP="$(find dist -maxdepth 1 -name '*portmaster-muos-h700.zip' -print -quit)"
          test -n "$BASE_ZIP"
          packaging/knulli/build.sh \
            "$BASE_ZIP" \
            "${{ github.ref_name }}" \
            dist
          rm -f "$BASE_ZIP"

      - name: Verify KNULLI package
        run: |
          KNULLI_ZIP="$(find dist -maxdepth 1 -name '*portmaster-knulli-h700.zip' -print -quit)"
          test -n "$KNULLI_ZIP"
          unzip -Z1 "$KNULLI_ZIP" > "$RUNNER_TEMP/knulli-package-entries.txt"
          grep -qx 'roms/ports/Chiaki.sh' "$RUNNER_TEMP/knulli-package-entries.txt"
          grep -qx 'roms/ports/chiaki/chiaki' "$RUNNER_TEMP/knulli-package-entries.txt"
          if grep -q 'libSDL2-2.0.so.0' "$RUNNER_TEMP/knulli-package-entries.txt"; then
            echo 'KNULLI package must not bundle SDL' >&2
            exit 1
          fi
          if grep -q 'libasound.so.2' "$RUNNER_TEMP/knulli-package-entries.txt"; then
            echo 'KNULLI package must not bundle ALSA' >&2
            exit 1
          fi

      - name: Generate SHA-256 checksum manifest
        run: bash scripts/write-release-checksum-manifest.sh dist

      - name: Generate changelog
        id: git_cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: Retro Chiaki for KNULLI ${{ github.ref_name }}
          body: |
            ${{ steps.git_cliff.outputs.content }}

            ---
            Source commit: `${{ github.sha }}`
            SHA-256 checksum manifest: see the `SHA256SUMS` release asset.
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            dist/*.zip
            dist/SHA256SUMS
