name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Linux native build and unit tests
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y             cmake             ninja-build             pkg-config             python3             protobuf-compiler             libssl-dev             libopus-dev             libsdl2-dev

      - name: Configure
        run: |
          cmake -S . -B build -GNinja             -DCHIAKI_ENABLE_TESTS=ON             -DCHIAKI_ENABLE_CLI=OFF             -DCHIAKI_ENABLE_GUI=OFF             -DCHIAKI_ENABLE_BOREALIS=OFF             -DCHIAKI_ENABLE_FFMPEG_DECODER=OFF

      - name: Build
        run: cmake --build build --parallel

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure
